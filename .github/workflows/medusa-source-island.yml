name: Medusa source island

on:
  pull_request:
    paths:
      - "*"
      - ".github/workflows/medusa-source-island.yml"
      - ".gitattributes"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "integration/**"
      - "tools/**"
      - "*.config.*"
      - "tsconfig*.json"
      - "third_party/medusa/**"
  push:
    branches:
      - main
    paths:
      - "*"
      - ".github/workflows/medusa-source-island.yml"
      - ".gitattributes"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "integration/**"
      - "tools/**"
      - "*.config.*"
      - "tsconfig*.json"
      - "third_party/medusa/**"

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm@10.33.2 install --frozen-lockfile
      - run: corepack pnpm@10.33.2 medusa:source:typecheck
      - run: corepack pnpm@10.33.2 test:medusa-source-island-boundary
      - run: corepack pnpm@10.33.2 check:medusa-source-island-boundary
      - run: corepack pnpm@10.33.2 medusa:source:verify
