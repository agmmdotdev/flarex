name: Trigger compatibility boundary

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-compatibility-boundary.yml"

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner diagnostic
        run: |
          set -euxo pipefail
          node --version
          npm --version
          echo WASIX_EXISTING_WORKFLOW_RUNNER_OK
