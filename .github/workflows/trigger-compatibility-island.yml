name: Trigger compatibility island

on:
  pull_request:
    paths:
      - ".github/workflows/trigger-compatibility-island.yml"
      - "package.json"
      - "third_party/trigger.dev/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-compatibility-island.yml"
      - "package.json"
      - "third_party/trigger.dev/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: third_party/trigger.dev

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: third_party/trigger.dev/upstream/.nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:source
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm test:unit

  full-engine-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: third_party/trigger.dev

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: third_party/trigger.dev/upstream/.nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm build:dependencies
      - if: matrix.shard == 1
        run: pnpm --filter supervisor exec vitest run src/backpressure/redisBackpressureSignalSource.test.ts --no-file-parallelism
      - run: pnpm --filter @internal/run-engine test -- --run --shard=${{ matrix.shard }}/4
