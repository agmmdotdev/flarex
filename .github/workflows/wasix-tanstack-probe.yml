name: WASIX TanStack Start probe fixture

on:
  push:
    branches:
      - chore/wasix-tanstack-probe
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wasix-tanstack-probe.yml

permissions:
  contents: read

jobs:
  build-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create pinned TanStack Start + Vite 7 fixture
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/wasix-fixture
          mkdir -p /tmp/wasix-fixture/src/routes
          cd /tmp/wasix-fixture

          cat > package.json <<'JSON'
          {
            "name": "wasix-tanstack-vite7-probe",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite dev"
            },
            "dependencies": {
              "@tanstack/react-router": "1.170.4",
              "@tanstack/react-start": "1.168.6",
              "react": "19.1.1",
              "react-dom": "19.1.1"
            },
            "devDependencies": {
              "@types/node": "24.3.0",
              "@types/react": "19.1.10",
              "@types/react-dom": "19.1.7",
              "@vitejs/plugin-react": "5.0.4",
              "esbuild": "npm:esbuild-wasm@0.25.9",
              "rollup": "npm:@rollup/wasm-node@4.46.1",
              "typescript": "5.9.2",
              "vite": "7.2.2"
            }
          }
          JSON

          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022",
              "jsx": "react-jsx",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "allowImportingTsExtensions": true,
              "verbatimModuleSyntax": true,
              "noEmit": true,
              "strict": true,
              "skipLibCheck": true,
              "types": ["vite/client"]
            },
            "include": ["src/**/*.ts", "src/**/*.tsx", "vite.config.ts"]
          }
          JSON

          cat > vite.config.ts <<'TS'
          import { defineConfig } from 'vite'
          import { tanstackStart } from '@tanstack/react-start/plugin/vite'
          import viteReact from '@vitejs/plugin-react'

          export default defineConfig({
            server: {
              host: '0.0.0.0',
              port: 3000,
              strictPort: true,
              watch: {
                usePolling: true,
                interval: 250,
              },
            },
            plugins: [tanstackStart(), viteReact()],
          })
          TS

          cat > src/router.tsx <<'TSX'
          import { createRouter } from '@tanstack/react-router'
          import { routeTree } from './routeTree.gen'

          export function getRouter() {
            return createRouter({
              routeTree,
              scrollRestoration: true,
            })
          }
          TSX

          cat > src/routes/__root.tsx <<'TSX'
          import type { ReactNode } from 'react'
          import {
            Outlet,
            createRootRoute,
            HeadContent,
            Scripts,
          } from '@tanstack/react-router'

          export const Route = createRootRoute({
            head: () => ({
              meta: [
                { charSet: 'utf-8' },
                { name: 'viewport', content: 'width=device-width, initial-scale=1' },
                { title: 'WASIX TanStack Probe' },
              ],
            }),
            component: RootComponent,
          })

          function RootComponent() {
            return (
              <RootDocument>
                <Outlet />
              </RootDocument>
            )
          }

          function RootDocument({ children }: Readonly<{ children: ReactNode }>) {
            return (
              <html>
                <head><HeadContent /></head>
                <body>{children}<Scripts /></body>
              </html>
            )
          }
          TSX

          cat > src/routes/index.tsx <<'TSX'
          import { createFileRoute } from '@tanstack/react-router'

          export const Route = createFileRoute('/')({
            component: Home,
          })

          function Home() {
            return (
              <main>
                <h1>WASIX_TANSTACK_OK</h1>
                <p>TanStack Start SSR through Vite 7.</p>
              </main>
            )
          }
          TSX

      - name: Install dependency graph with WASM build-tool aliases
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/wasix-fixture
          npm install --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const rollup = require('./node_modules/rollup/package.json')
          const esbuild = require('./node_modules/esbuild/package.json')
          const vite = require('./node_modules/vite/package.json')
          console.log(JSON.stringify({
            vite: `${vite.name}@${vite.version}`,
            rollup: `${rollup.name}@${rollup.version}`,
            esbuild: `${esbuild.name}@${esbuild.version}`,
          }, null, 2))
          if (rollup.name !== '@rollup/wasm-node') throw new Error('rollup alias is not WASM')
          if (esbuild.name !== 'esbuild-wasm') throw new Error('esbuild alias is not WASM')
          NODE

      - name: Native Node preflight
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/wasix-fixture
          export CHOKIDAR_USEPOLLING=true
          export CHOKIDAR_INTERVAL=250
          npm run dev -- --host 127.0.0.1 > /tmp/vite-native-preflight.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/native-response.html; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/vite-native-preflight.log
              exit 1
            fi
            sleep 0.5
          done

          cat /tmp/vite-native-preflight.log
          test "$ready" = 1
          grep -q 'WASIX_TANSTACK_OK' /tmp/native-response.html
          test -f src/routeTree.gen.ts
          cp /tmp/vite-native-preflight.log ./vite-native-preflight.log
          cp /tmp/native-response.html ./native-response.html

      - name: Pack fixture preserving symlinks and executable bits
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          tar -czf wasix-tanstack-vite7-fixture.tar.gz wasix-fixture
          tar -tzf wasix-tanstack-vite7-fixture.tar.gz | head -100
          sha256sum wasix-tanstack-vite7-fixture.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: wasix-tanstack-vite7-fixture
          path: /tmp/wasix-tanstack-vite7-fixture.tar.gz
          retention-days: 1
          if-no-files-found: error
