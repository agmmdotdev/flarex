name: WASIX TanStack Start probe fixture

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wasix-tanstack-probe.yml

permissions:
  contents: read

jobs:
  build-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npm --version
          echo WASIX_PROBE_RUNNER_OK
