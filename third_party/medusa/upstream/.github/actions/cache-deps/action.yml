name: cache-deps
description: Creates a cache with the given extension for monorepo dependencies
inputs:
  extension:
    description: Extension for cache name
  node-version:
    description: Node version
    default: "24"
  skip-build:
    description: Skip build step (default false)
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@11.7.0 --activate
        pnpm config set store-dir ~/.pnpm-store

    - uses: actions/cache@v4
      id: cache
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: ${{ runner.os }}-pnpm-${{inputs.extension}}-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{inputs.extension}}-v1-
      # We want to only bootstrap and install if no cache is found.
    - run: pnpm install --frozen-lockfile
      shell: bash
      if: steps.cache.outputs.cache-hit != 'true'

    - run: pnpm build
      shell: bash
      if: ${{ inputs.skip-build != 'true' }}
