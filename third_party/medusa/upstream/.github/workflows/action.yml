        with:
          name: build-artifacts
          path: .

      - name: Run Currency integration shadow
        run: pnpm check:currency-integration-shadow
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: postgres
          DB_PORT: "5432"
          DB_USERNAME: postgres

