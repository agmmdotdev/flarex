name: Medusa Pipeline
on:
  push:
    branches:
      - develop
      - v1.x
  pull_request:
    branches:
      - "**"

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Assert changed
        run: ./scripts/assert-changed-files-actions.sh "packages"

      - name: Install dependencies
        uses: ./.github/actions/cache-deps
        with:
          extension: pipeline

      - name: Check test runner foundation
        run: pnpm check:test-runner-foundation

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/**/dist
            integration-tests/**/dist
            !packages/**/node_modules
          retention-days: 1

  unit-tests-matrix:
    needs: setup
    name: Unit Tests - Shard ${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard_index: [1, 2, 3, 4]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Get number of CPU cores
        id: cpu-cores
        uses: SimenB/github-actions-cpu-cores@v2

      - name: Install dependencies
        uses: ./.github/actions/cache-deps
        with:
          extension: pipeline
          skip-build: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Run unit tests
        run: |
          pnpm test --filter='!@medusajs/framework' --filter='!@medusajs/utils' -- -- --shard=${{ matrix.shard_index }}/4 --maxWorkers=${{ steps.cpu-cores.outputs.count }} --passWithNoTests
          pnpm test --filter=@medusajs/framework --filter=@medusajs/utils -- -- --shard=${{ matrix.shard_index }}/4 --passWithNoTests

  unit-tests:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: unit-tests-matrix
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.unit-tests-matrix.result, 'failure')
            || contains(needs.unit-tests-matrix.result, 'cancelled')
            || contains(needs.unit-tests-matrix.result, 'skipped')
          }}
      - run: exit 0
        if: ${{ contains(needs.unit-tests-matrix.result, 'success') }}

  integration-tests-pglite:
    needs: setup
    name: PGlite Integration Tests (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install dependencies
        uses: ./.github/actions/cache-deps
        with:
          extension: pipeline
          skip-build: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Run serial PGlite integration matrix
        run: pnpm test:integration:pglite

  currency-integration-shadow:
    needs: setup
    name: Currency Integration Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
